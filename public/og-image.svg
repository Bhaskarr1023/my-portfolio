<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#020202"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.02"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Top Developer Pill -->
  <g transform="translate(80, 100)">
    <rect width="360" height="38" rx="19" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12"/>
    <circle cx="24" cy="19" r="4" fill="#34d399"/>
    <text x="40" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="2">BHASKAR</text>
    <text x="140" y="24" fill="#666666" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13"> / </text>
    <text x="160" y="24" fill="#a3a3a3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" letter-spacing="1">FULL-STACK DEVELOPER</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 220)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="300" letter-spacing="-1">BUILDING MODERN</text>
    <text x="0" y="76" fill="#a3a3a3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="300" letter-spacing="-1">WEB EXPERIENCES.</text>
  </g>

  <!-- Supporting Subtitle -->
  <g transform="translate(80, 360)">
    <text x="0" y="0" fill="#737373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="300">
      Frontend-focused full-stack developer engineering React applications, fluid GSAP motion, and 3D WebGL interfaces.
    </text>
  </g>

  <!-- Tech Stack Pills -->
  <g transform="translate(80, 460)">
    <!-- Pill 1: React -->
    <g transform="translate(0, 0)">
      <rect width="90" height="34" rx="17" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
      <text x="45" y="22" text-anchor="middle" fill="#d4d4d4" font-family="monospace" font-size="12">React</text>
    </g>
    <!-- Pill 2: JavaScript -->
    <g transform="translate(104, 0)">
      <rect width="115" height="34" rx="17" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
      <text x="57" y="22" text-anchor="middle" fill="#d4d4d4" font-family="monospace" font-size="12">JavaScript</text>
    </g>
    <!-- Pill 3: GSAP -->
    <g transform="translate(233, 0)">
      <rect width="80" height="34" rx="17" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
      <text x="40" y="22" text-anchor="middle" fill="#d4d4d4" font-family="monospace" font-size="12">GSAP</text>
    </g>
    <!-- Pill 4: Three.js -->
    <g transform="translate(327, 0)">
      <rect width="105" height="34" rx="17" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
      <text x="52" y="22" text-anchor="middle" fill="#d4d4d4" font-family="monospace" font-size="12">Three.js</text>
    </g>
    <!-- Pill 5: Tailwind -->
    <g transform="translate(446, 0)">
      <rect width="125" height="34" rx="17" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
      <text x="62" y="22" text-anchor="middle" fill="#d4d4d4" font-family="monospace" font-size="12">Tailwind CSS</text>
    </g>
  </g>

  <!-- Bottom URL / Brand Watermark -->
  <g transform="translate(80, 550)">
    <text x="0" y="0" fill="#525252" font-family="monospace" font-size="14" letter-spacing="1">https://my-portfolio-orqiva.vercel.app</text>
  </g>
</svg>
